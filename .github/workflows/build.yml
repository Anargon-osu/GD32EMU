name: build and test
on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-packages:
    uses: ./.github/workflows/tests.yml
    secrets: inherit
  arm64-packages:
    uses: ./.github/workflows/tests-arm64.yml
    secrets: inherit
  release:
    needs: [verified-packages, arm64-packages]
    if: |
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.verified-packages.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: gd32emu-*
          path: packages
          merge-multiple: true
      - name: Attach verified archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          pre=()
          case "$RELEASE_TAG" in *[Rr][Cc]*) pre=(--prerelease) ;; esac
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes "${pre[@]}"
          fi
          gh release upload "$RELEASE_TAG" packages/* --clobber